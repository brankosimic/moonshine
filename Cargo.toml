[workspace]
members = [".", "moonshine-core", "moonshine-tools", "moonshine-wsi"]
resolver = "2"

# TEMP (debug): patch pixelforge to a local copy so we can instrument the
# color converter's YUV output. Remove this block + .pixelforge-patch/ when done.
[patch."https://github.com/hgaiser/pixelforge"]
pixelforge = { path = ".pixelforge-patch" }

[workspace.package]
version = "0.15.0"

[package]
name = "moonshine"
version.workspace = true
edition = "2024"

[dependencies]
async-shutdown = "0.2.2"
clap = { version = "4.6.1", features = ["derive"] }
moonshine-core = { path = "moonshine-core" }
tokio = { version = "1.52.3", features = ["rt-multi-thread", "signal", "sync", "macros"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zbus = "5.18.0"
