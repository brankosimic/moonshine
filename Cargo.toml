[workspace]
members = [".", "moonshine-core", "moonshine-tools", "moonshine-wsi"]
resolver = "2"

# Patch pixelforge to a local fork that fixes the color converter on RADV/AMD:
# upstream v0.9.1 populates COMBINED_IMAGE_SAMPLER descriptors via
# VK_EXT_descriptor_buffer (vkGetDescriptorEXT), which on this driver makes
# texelFetch return only the R channel (G/B/A read as zero) -> green-screen
# stream. The fork switches the converter to a plain descriptor set, which
# samples correctly. Keep this until the fix is upstreamed and a new tag cut.
[patch."https://github.com/hgaiser/pixelforge"]
pixelforge = { path = ".pixelforge-patch" }

[workspace.package]
version = "0.15.0"

[package]
name = "moonshine"
version.workspace = true
edition = "2024"

[dependencies]
async-shutdown = "0.2.2"
clap = { version = "4.6.1", features = ["derive"] }
moonshine-core = { path = "moonshine-core" }
tokio = { version = "1.52.3", features = ["rt-multi-thread", "signal", "sync", "macros"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zbus = "5.18.0"
